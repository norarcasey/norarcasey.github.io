<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Atkinson Hyperlegible, one family and two faces: Next for everything,
         Mono for the wordmark, eyebrows, dates and stack lines. This is the
         prerender's template, so the link reaches every route. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The browser chrome follows the page's ground, in either scheme. -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12161b"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Nora Casey — software engineer building frontend and full-stack tools that empower people. Browse my projects, résumé, and ways to get in touch."
    />
    <link rel="canonical" href="https://noracasey.com/" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nora Casey" />
    <meta property="og:title" content="Nora Casey" />
    <meta
      property="og:description"
      content="Software engineer building frontend and full-stack tools that empower people. Browse my projects, résumé, and ways to get in touch."
    />
    <meta property="og:url" content="https://noracasey.com/" />
    <meta property="og:image" content="https://noracasey.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="[\n]ora casey — software engineer building frontend and full-stack tools that empower people."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nora Casey" />
    <meta
      name="twitter:description"
      content="Software engineer building frontend and full-stack tools that empower people."
    />
    <meta name="twitter:image" content="https://noracasey.com/og.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <title>Nora Casey</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
