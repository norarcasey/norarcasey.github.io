name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing a post used to arrive here as a repository_dispatch, because
# rebuilding was something only a token with write access to this repo could
# ask for. It goes straight to a Vercel deploy hook now, which skips this
# workflow entirely -- deliberately. A new post rebuilds the same commit
# against new data, so there is no new code to lint and nothing these checks
# would be checking. Code changes still come through here and are still gated.
permissions:
  contents: read

# Only one production deploy at a time; let an in-progress run finish.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Healthy runs take ~3 minutes; the cap keeps an infrastructure hang from
    # burning hours of Actions time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # Browser binary only — deliberately NOT `--with-deps`, which shells out
      # to apt-get and has hung for hours on a bad Ubuntu mirror. The
      # ubuntu-latest image already carries the libraries Chromium needs, so a
      # missing one fails fast at launch rather than stalling the job.
      - name: Install Playwright browser
        run: yarn playwright install chromium

      - name: End-to-end accessibility scan
        run: yarn test:e2e
        env:
          # Playwright's webServer runs its own `yarn build`, so this step needs
          # the same credentials as the build step below — without them the
          # blog fetch aborts the build and the scan never gets a server.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # No separate build step. `vercel build` below runs the project's own
      # build command, and the accessibility scan above has already built the
      # site once through Playwright's webServer. Building a third time would
      # only prove the same thing more slowly.
      #
      # The two builds do differ in one useful way: the scan builds with the
      # secrets in this repo, and `vercel build` builds with the environment
      # configured in the Vercel project. A mismatch between them shows up here
      # rather than as an empty blog in production.

      - name: Deploy to Vercel
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
